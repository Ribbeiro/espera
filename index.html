<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#1C0812" />
    <title>Para você</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23C41E3A'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,500&family=Figtree:wght@400;500;600&family=Reenie+Beanie&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="cadeado" class="cadeado">
      <div class="cadeado__luzes" aria-hidden="true"></div>
      <form id="cadeado-form" class="cadeado__form" autocomplete="off" novalidate>
        <h1 class="cadeado__titulo">Pra você</h1>
        <label for="senha" class="cadeado__dica">A data mais importante da nossa vida <span class="cadeado__formato">(ddmmaa)</span></label>
        <div class="cadeado__campo" id="cadeado-campo">
          <input id="senha" name="senha" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6"
                 autocomplete="one-time-code" aria-describedby="cadeado-msg" spellcheck="false" />
          <div class="cadeado__slots" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>
        <p id="cadeado-msg" class="cadeado__msg" role="status" aria-live="polite"></p>
        <button id="cadeado-entrar" class="botao" type="submit">
          <span class="botao__rotulo">Entrar</span>
          <span class="botao__giro" aria-hidden="true"></span>
        </button>
        <p class="cadeado__som">Aumenta o volume.</p>
      </form>
    </div>

    <div id="app" class="app" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
